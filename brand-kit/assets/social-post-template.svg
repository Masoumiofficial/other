<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">قالب پست مربعی آهنگ‌بان</title>
  <desc id="desc">قالب مینیمال مشکی و سفید برای پست معرفی یا پرسش</desc>
  <style><![CDATA[
    @font-face { font-family: "AhangbanVazirmatn"; src: url("fonts/vazirmatn-arabic-400.woff2") format("woff2"); font-weight: 400 600; font-style: normal; font-display: swap; }
    @font-face { font-family: "AhangbanVazirmatn"; src: url("fonts/vazirmatn-arabic-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "AhangbanVazirmatn"; src: url("fonts/vazirmatn-arabic-800.woff2") format("woff2"); font-weight: 800 900; font-style: normal; font-display: swap; }
  ]]></style>
  <rect width="1080" height="1080" fill="#111111"/>
  <rect x="58" y="58" width="964" height="964" rx="34" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".24"/>
  <g transform="translate(462 150) scale(.85)" fill="#FFFFFF">
    <rect x="14" y="60" width="12" height="38" rx="6"/><rect x="36" y="40" width="12" height="58" rx="6"/>
    <rect x="58" y="20" width="12" height="78" rx="6"/><rect x="80" y="44" width="12" height="54" rx="6"/>
    <rect x="102" y="56" width="12" height="42" rx="6"/>
  </g>
  <text x="540" y="390" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="AhangbanVazirmatn, Tahoma, Arial, sans-serif" font-size="62" font-weight="800" fill="#FFFFFF">آهنگ‌بان</text>
  <text x="540" y="590" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="AhangbanVazirmatn, Tahoma, Arial, sans-serif" font-size="70" font-weight="800" fill="#FFFFFF">[تیتر کوتاه]</text>
  <text x="540" y="685" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="AhangbanVazirmatn, Tahoma, Arial, sans-serif" font-size="30" font-weight="500" fill="#BDBDBD">[توضیح یا پرسش]</text>
  <rect x="340" y="800" width="400" height="82" rx="41" fill="#185ADB"/>
  <text x="540" y="853" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="AhangbanVazirmatn, Tahoma, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">[دعوت به اقدام]</text>
  <text x="540" y="963" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="AhangbanVazirmatn, Tahoma, Arial, sans-serif" font-size="18" font-weight="400" fill="#BDBDBD">قالب نمونه · متن و پیوند را پیش از انتشار بررسی کنید</text>
</svg>
