<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">قالب معرفی اثر آهنگ‌بان</title>
  <desc id="desc">قالب معرفی آهنگ با جایگاه کاور و اطلاعات سازنده، به رنگ‌های مشکی و سفید</desc>
  <rect width="1080" height="1350" fill="#FFFFFF"/>
  <rect width="1080" height="260" fill="#111111"/>
  <g transform="translate(828 52) scale(.48)" fill="#FFFFFF">
    <rect x="14" y="60" width="12" height="38" rx="6"/><rect x="36" y="40" width="12" height="58" rx="6"/>
    <rect x="58" y="20" width="12" height="78" rx="6"/><rect x="80" y="44" width="12" height="54" rx="6"/>
    <rect x="102" y="56" width="12" height="42" rx="6"/>
  </g>
  <text x="940" y="145" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn, Tahoma, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">آهنگ‌بان · معرفی اثر</text>
  <rect x="110" y="320" width="860" height="575" rx="24" fill="#F4F4F4" stroke="#E5E5E5" stroke-width="2"/>
  <rect x="390" y="515" width="300" height="190" rx="18" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <text x="540" y="625" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn, Tahoma, sans-serif" font-size="30" font-weight="600" fill="#666666">جای کاور مجاز</text>
  <text x="940" y="1010" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn, Tahoma, sans-serif" font-size="48" font-weight="800" fill="#111111">[نام اثر]</text>
  <text x="940" y="1080" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn, Tahoma, sans-serif" font-size="30" font-weight="500" fill="#666666">[نام هنرمند · نوع نسخه]</text>
  <rect x="670" y="1140" width="300" height="84" rx="42" fill="#111111"/>
  <text x="820" y="1194" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn, Tahoma, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">[اقدامِ فعال]</text>
  <text x="110" y="1300" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn, Tahoma, sans-serif" font-size="18" font-weight="400" fill="#666666">قالب نمونه · اطلاعات، مجوز و وضعیت دسترسی را بررسی کنید</text>
</svg>
