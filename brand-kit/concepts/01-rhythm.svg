<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f4f4f4"/><rect x="70" y="70" width="1460" height="860" rx="32" fill="#fff" stroke="#e5e5e5" stroke-width="3"/><text x="1450" y="175" text-anchor="end" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111">مسیر ۰۱ · ریتم روشن</text><text x="1450" y="220" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#666">یک سیستم ساده برای کشف، انتخاب و شنیدن</text><g transform="translate(180 355)" fill="#185ADB"><rect x="0" y="190" width="56" height="170" rx="28"/><rect x="92" y="130" width="56" height="230" rx="28"/><rect x="184" y="75" width="56" height="285" rx="28"/><rect x="276" y="150" width="56" height="210" rx="28"/><rect x="368" y="105" width="56" height="255" rx="28"/></g><g transform="translate(790 320)"><rect width="500" height="300" rx="28" fill="#111"/><text x="250" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#fff">آهنگ‌بان</text><text x="250" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#bdbdbd">از پیدا کردن تا شنیدن.</text><rect x="118" y="194" width="264" height="48" rx="24" fill="#185ADB"/><text x="250" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#fff">جست‌وجوی یک اثر</text></g><text x="145" y="825" font-family="Arial, sans-serif" font-size="20" fill="#666">کلیدواژه‌ها: ریتم · نشانه‌گذاری · مسیر کوتاه · تمرکز</text></svg>